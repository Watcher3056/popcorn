<script>
// 0 … 4200: what is coming, up front: the two problems appear one by one
const head = el('div', 'sc-h abs', null, 'Two things make weekly shopping slow'); box(head, 110, 120, 760); show(head, 150, 420, 12);
['Recipes scattered across tabs', 'A list rebuilt by hand'].forEach((txt, i) => {
  const r = el('div', 'sc-row abs', null, `<b>${i + 1}</b><span>${esc(txt)}</span>`); box(r, 110, 230 + i * 92, 600);
  const t = 1100 + i * 700; pt(r, 'o', t, 0); pt(r, 'o', t + 300, 1); pt(r, 'x', t, -24); pt(r, 'x', t + 350, 0); sfx(t, 'drop');
});
window.TOTAL = 4200;
finalize();
