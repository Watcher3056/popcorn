<script>
// the cover, composed for itself: the pain in the viewer's words over the one picture that shows it; it is frame 0

for (const name of ['Eggs', 'Flour', 'Milk']) el('div', 'sc-item', list, '<span class="ck"></span><span class="nm">' + name + '</span>');
el('div', 'sc-item gap', list, '<span></span>');
xmark(850, 290, 0);
window.TOTAL = 1000;
finalize();
